[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tunefinder"
version = "0.4.0"
description = "Find streaming links (Spotify, Apple Music, Deezer, YouTube Music, Qobuz, SoundCloud) for any track."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Louis Courrian", email = "louis.courrian@gmail.com" },
]
keywords = [
    "music",
    "streaming",
    "spotify",
    "deezer",
    "apple-music",
    "youtube-music",
    "qobuz",
    "soundcloud",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Internet",
    "Typing :: Typed",
]
dependencies = [
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
tunefinder = "tunefinder.__main__:main"

[project.urls]
Homepage = "https://github.com/LouisCourrian/tunefinder"
Issues = "https://github.com/LouisCourrian/tunefinder/issues"
Changelog = "https://github.com/LouisCourrian/tunefinder/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tunefinder"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/tunefinder"]
